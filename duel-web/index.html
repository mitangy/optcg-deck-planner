  <head>

    <meta name="theme-color" content="#0b1720" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Solid, not black-translucent: iOS blurs web content drawn under the
         status bar, which fogged the top bar in the Home Screen app. "default"
         lets iOS paint the bar with theme-color (the arena background) instead
         of the fixed black of "black". -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OPTCG Duel" />
    <title>OPTCG Duel – free unofficial One Piece TCG simulator</title>
    <meta name="description" content="Play OPTCG online, free in your browser. An unofficial fan-made One Piece TCG simulator with ranked matches, bots, friends and your own decks. No download." />
    <link rel="canonical" href="https://optcgduel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OPTCG Duel" />
    <meta property="og:title" content="OPTCG Duel – free unofficial One Piece TCG simulator" />
    <meta property="og:description" content="Play OPTCG online, free in your browser. An unofficial fan-made One Piece TCG simulator with ranked matches, bots, friends and your own decks. No download." />
    <meta property="og:url" content="https://optcgduel.app/" />
    <meta property="og:image" content="https://optcgduel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OPTCG Duel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OPTCG Duel – free unofficial One Piece TCG simulator" />
    <meta name="twitter:description" content="Play OPTCG online, free in your browser. An unofficial fan-made One Piece TCG simulator with ranked matches, bots, friends and your own decks. No download." />
    <meta name="twitter:image" content="https://optcgduel.app/og-image.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "OPTCG Duel",
      "url": "https://optcgduel.app/",
      "description": "Play OPTCG online, free in your browser. An unofficial fan-made One Piece TCG simulator with ranked matches, bots, friends and your own decks. No download.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any (web browser)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "genre": "Card game"
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the saved colour theme and light / dark mode before the first
      // paint (App re-applies them on every change). theme-color follows the theme's background so the
      // Home Screen status bar matches from launch.
      try {
        var s = JSON.parse(localStorage.getItem("optcg-duel:settings") || "{}");
        var r = document.documentElement;
        var t = s.theme;
        var mode = s.colorMode;
        if (mode === "system") {
          mode = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (typeof t === "string" && t !== "nightSea") r.dataset.theme = t;
        if (mode === "light") r.dataset.mode = "light";
        var ts = { small: 0.9, large: 1.12, xlarge: 1.25 }[s.textSize];
        if (ts) r.style.setProperty("--text-scale", String(ts));
        if (r.dataset.theme || r.dataset.mode) {
          var bg = getComputedStyle(r).getPropertyValue("--arena-deep").trim();
          var m = document.querySelector('meta[name="theme-color"]');
          if (bg && m) m.setAttribute("content", bg);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
