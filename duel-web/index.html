<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1720" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Solid, not black-translucent: iOS blurs web content drawn under the
         status bar, which fogged the top bar in the Home Screen app. "default"
         lets iOS paint the bar with theme-color (the arena background) instead
         of the fixed black of "black". -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OPTCG Duel" />
    <title>OPTCG Duel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the saved colour theme before the first paint (App re-applies it
      // on every change). theme-color follows the theme's background so the
      // Home Screen status bar matches from launch.
      try {
        var t = JSON.parse(localStorage.getItem("optcg-duel:settings") || "{}").theme;
        if (typeof t === "string" && t !== "nightSea") {
          var r = document.documentElement;
          r.dataset.theme = t;
          var bg = getComputedStyle(r).getPropertyValue("--arena-deep").trim();
          var m = document.querySelector('meta[name="theme-color"]');
          if (bg && m) m.setAttribute("content", bg);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
