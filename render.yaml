# Render Blueprint — API + Colyseus game-server.
# Frontend (deck planner + duel-web) stays on Vercel.
#
# First-time / existing services:
# - Dashboard names must match (`optcg-api`, `optcg-game-server`) for adopt-in-place.
# - Create env group `optcg-duel-shared` values once (GAME_TOKEN_SECRET, DUEL_INGEST_SECRET)
#   and use the SAME values on both services. Do not commit secret values here.
# - After merge: Blueprint Sync in Render, then Manual Deploy game-server if it was
#   previously dashboard-only.

envVarGroups:
  - name: optcg-duel-shared
    envVars:
      # HMAC secret for short-lived Colyseus join tokens (API mints, game-server verifies).
      - key: GAME_TOKEN_SECRET
        sync: false
      # Match-result ingest header (game-server → API).
      - key: DUEL_INGEST_SECRET
        sync: false
  - name: optcg-analyst-shared
    envVars:
      # Lets the Log Pose service read full match replays from the API (set once, same on both).
      - key: ANALYST_SERVICE_SECRET
        sync: false

services:
  - type: web
    name: optcg-api
    runtime: python
    plan: starter
    rootDir: backend
    # Redeploy on every push to the linked branch (frontend is on Vercel separately).
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # WEB_CONCURRENCY workers (1 by default: Starter has 512 MB). Raise it only
    # with REDIS_URL set, so rate limits, presence and live-game progress are
    # shared; startup migrations take a Postgres advisory lock (app.db.startup_lock).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - fromGroup: optcg-duel-shared
      - fromGroup: optcg-analyst-shared
      # Public URL of optcg-analyst, for personal connector links made in duel-web Settings.
      - key: ANALYST_PUBLIC_URL
        sync: false
      # Comma-separated emails that get the in-app Log Pose panel (empty: nobody).
      # Spend caps default to $3/day per player and $50/month total (backend/app/config.py).
      - key: ANALYST_CHAT_EMAILS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://optcg-deck-planner.app
      - key: BACKEND_PUBLIC_URL
        value: https://optcg-deck-planner.app/api
      # Same value as PROXY_SHARED_SECRET on both Vercel projects; lets client_ip trust X-Forwarded-For from the /api proxy.
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOW_ANY_GOOGLE_USER
        value: "true"
      - key: CATALOG_SYNC_TOKEN
        generateValue: true
      # Optional Redis / Key Value (redis://… or rediss://…). Unset: rate limits are
      # per worker and presence / live-game progress stay in Postgres.
      - key: REDIS_URL
        sync: false
      # Game-server URL handed out with duel tokens; PUT /duel/admin/game-server-pool
      # overrides it while Redis is set (blue/green). Unset: clients use their build default.
      - key: GAME_SERVER_URL
        sync: false
      # Signs public playmat / card back links (falls back to SESSION_SECRET).
      # Rotating it retires every link handed out so far.
      - key: COSMETIC_URL_SECRET
        sync: false
      - key: DUEL_CORS_ORIGINS
        value: https://optcgduel.app,https://optcg-duel-web.vercel.app,https://optcg-duel-web-miko21.vercel.app
      # Vercel branch URLs (optcg-duel-web-git-<branch>-miko21.vercel.app): CORS without credentials (see backend/app/cors.py).
      # SPAs that proxy /api here and host their own Google callback
      # ({origin}/api/auth/callback, registered in Google Cloud Console).
      - key: OAUTH_CALLBACK_ORIGINS
        value: https://optcgduel.app
      - key: DUEL_CORS_ORIGIN_REGEX
        value: 'https://optcg-duel-web-git-[a-z0-9-]+-miko21\.vercel\.app'

  - type: web
    name: optcg-game-server
    # Node (not Docker): runtime is immutable on Render — existing dashboard
    # service is Node. Dockerfile remains available for local/prod container builds.
    runtime: node
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    # Install workspaces from repo root so @optcg/rules resolves.
    buildCommand: npm ci --workspace=@optcg/rules --workspace=@optcg/game-server
    startCommand: npm run start -w @optcg/game-server
    buildFilter:
      paths:
        - game-server/**
        - packages/rules/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - fromGroup: optcg-duel-shared
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Public FastAPI base used for match ingest (Render service URL).
      - key: API_BASE_URL
        value: https://optcg-api-nutb.onrender.com
      # Durable game-server outbox. Set this to the same Neon Postgres URL as the API.
      - key: MATCH_OUTBOX_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://optcgduel.app,https://optcg-duel-web.vercel.app,https://optcg-duel-web-miko21.vercel.app
      # Vercel branch URLs (optcg-duel-web-git-<branch>-miko21.vercel.app).
      - key: CORS_ORIGIN_REGEX
        value: 'https://optcg-duel-web-git-[a-z0-9-]+-miko21\.vercel\.app'

  # Log Pose: deck analyst tools for Claude, served over MCP (Claude custom connector).
  # Connector URL: https://<this service>.onrender.com/mcp/<ANALYST_CONNECTOR_KEY>,
  # or a personal https://<this service>.onrender.com/mcp/u/<token> link from duel-web Settings.
  - type: web
    name: optcg-analyst
    runtime: node
    # Free instances sleep when idle; the first tool call after a nap waits for a cold start.
    # The in-app chat panel feels much better on starter (no cold start); switch when it launches.
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci --workspace=@optcg/rules --workspace=@optcg/deck-analytics --workspace=@optcg/analyst
    startCommand: npm run start -w @optcg/analyst
    buildFilter:
      paths:
        - analyst/**
        - packages/deck-analytics/**
        - packages/rules/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - fromGroup: optcg-analyst-shared
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Secret path segment of the connector URL. Copy it from the dashboard.
      - key: ANALYST_CONNECTOR_KEY
        generateValue: true
      - key: PLANNER_API_URL
        value: https://optcg-deck-planner.app/api
      # Claude API key for the in-app chat panel and post-game reviews; without it /chat answers 503.
      - key: ANTHROPIC_API_KEY
        sync: false
