
envVarGroups:
  - name: optcg-duel-shared
    envVars:
      - key: GAME_TOKEN_SECRET
        sync: false
      - key: DUEL_INGEST_SECRET
        sync: false
  - name: optcg-analyst-shared
    envVars:
      - key: ANALYST_SERVICE_SECRET
        sync: false

services:
  - type: web
    name: optcg-api
    runtime: python
    plan: starter
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # WEB_CONCURRENCY workers (1 by default: Starter has 512 MB). Raise it only
    # with REDIS_URL set, so rate limits, presence and live-game progress are
    # shared; startup migrations take a Postgres advisory lock (app.core.db.startup_lock).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - fromGroup: optcg-duel-shared
      - fromGroup: optcg-analyst-shared
      - key: ANALYST_PUBLIC_URL
        sync: false
      - key: ANALYST_CHAT_EMAILS
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_FEEDBACK_CHANNEL_ID
        sync: false
      - key: GITHUB_ISSUES_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://optcg-deck-planner.app
      - key: BACKEND_PUBLIC_URL
        value: https://optcg-deck-planner.app/api
      # Lets client_ip trust X-Forwarded-For from the /api proxy; same value as PROXY_SHARED_SECRET on both Vercel projects.
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOW_ANY_GOOGLE_USER
        value: "true"
      - key: CATALOG_SYNC_TOKEN
        generateValue: true
      # Kept apart from CATALOG_SYNC_TOKEN, which the catalog workflows hold. While unset those routes still accept CATALOG_SYNC_TOKEN.
      - key: OPS_ADMIN_TOKEN
        sync: false
      # Optional Redis / Key Value (redis://… or rediss://…). Unset: rate limits are
      # per worker and presence / live-game progress stay in Postgres.
      - key: REDIS_URL
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      # PUT /duel/admin/game-server-pool overrides it while Redis is set (blue/green).
      - key: GAME_SERVER_URL
        sync: false
      # Rotating it retires every link handed out so far.
      - key: COSMETIC_URL_SECRET
        sync: false
      - key: DUEL_CORS_ORIGINS
        value: https://optcgduel.app,https://optcg-duel-web.vercel.app,https://optcg-duel-web-miko21.vercel.app
      - key: OAUTH_CALLBACK_ORIGINS
        value: https://optcgduel.app
      - key: DUEL_CORS_ORIGIN_REGEX
        value: 'https://optcg-duel-web-git-[a-z0-9-]+-miko21\.vercel\.app'

  - type: web
    name: optcg-game-server
    # Node (not Docker): runtime is immutable on Render and the existing dashboard service is Node.
    runtime: node
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    # Install workspaces from repo root so @optcg/rules and @optcg/duel-protocol resolve.
    buildCommand: npm ci --workspace=@optcg/rules --workspace=@optcg/duel-protocol --workspace=@optcg/game-server
    startCommand: npm run start -w @optcg/game-server
    buildFilter:
      paths:
        - game-server/**
        - packages/rules/**
        - packages/card-core/**
        - packages/duel-protocol/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - fromGroup: optcg-duel-shared
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://optcg-api-nutb.onrender.com
      - key: MATCH_OUTBOX_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://optcgduel.app,https://optcg-duel-web.vercel.app,https://optcg-duel-web-miko21.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: 'https://optcg-duel-web-git-[a-z0-9-]+-miko21\.vercel\.app'

  - type: web
    name: optcg-analyst
    runtime: node
    # Free instances sleep when idle; the first tool call after a nap waits for a cold start.
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci --workspace=@optcg/rules --workspace=@optcg/deck-analytics --workspace=@optcg/card-core --workspace=@optcg/analyst-contract --workspace=@optcg/analyst
    startCommand: npm run start -w @optcg/analyst
    buildFilter:
      paths:
        - analyst/**
        - packages/deck-analytics/**
        - packages/card-core/**
        - packages/analyst-contract/**
        - packages/price-timing/**
        - packages/ui/**
        - packages/rules/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - fromGroup: optcg-analyst-shared
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ANALYST_CONNECTOR_KEY
        generateValue: true
      - key: PLANNER_API_URL
        value: https://optcg-deck-planner.app/api
      - key: ANTHROPIC_API_KEY
        sync: false
