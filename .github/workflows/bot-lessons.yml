name: Bot lessons

# Weekly: compares each leader's bot-game line stats (the nightly Hard vs Hard corpus, see bot-selfplay.yml) with the same
# lines in real archive games, and saves the lines both agree on as draft lessons (#915). The site owner approves them in
# the duel app (Settings, Log Pose); an approved one reaches every player's Log Pose with the sim stats. A lesson the
# planner already has, in any status, is skipped, so reruns add nothing.
#
# Needs ANALYST_API_URL (the backend's base URL, a repository variable or a secret) and a secret ANALYST_SERVICE_SECRET
# (the same value as the backend's ANALYST_SERVICE_SECRET). Without both it does nothing.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-lessons
  cancel-in-progress: false

jobs:
  lessons:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANALYST_API_URL: ${{ vars.ANALYST_API_URL || secrets.ANALYST_API_URL }}
      ANALYST_SERVICE_SECRET: ${{ secrets.ANALYST_SERVICE_SECRET }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$ANALYST_API_URL" ] || [ -z "$ANALYST_SERVICE_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping bot lessons: set the ANALYST_API_URL variable and the ANALYST_SERVICE_SECRET secret to turn it on." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: ${{ steps.cfg.outputs.ready == 'true' }}
      - uses: actions/setup-node@v7
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
        if: ${{ steps.cfg.outputs.ready == 'true' }}
      - name: Draft lessons from bot and real games
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        run: |
          set -o pipefail
          {
            echo "### Bot lessons"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          npm run bot-lessons -w @optcg/analyst -- --all-leaders --post 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
