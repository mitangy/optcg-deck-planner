name: Log Pose review facts

# Manual only: the paid review fact-check (analyst/evals/review-facts, #675). About $2 for 20 games. Never scheduled.
# Bots play fresh games with the current meta decks, Log Pose reviews each one with the production prompt, and every
# concrete fact in a review is checked against the replay. Needs the ANTHROPIC_API_KEY secret; the meta decks come
# from the public backend (ANALYST_API_URL), and without it the bots use random decks.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Output folder / run label"
        default: "baseline"
      n:
        description: "Games to review"
        default: "20"
      seed:
        description: "First self-play seed"
        default: "1"
      levels:
        description: "Bot levels (e.g. normal,normal or hard,hard)"
        default: "normal,normal"
      max_usd:
        description: "Stop dispatching past this spend"
        default: "5"
      post:
        description: "Save the result to the admin page (needs ANALYST_API_URL and ANALYST_SERVICE_SECRET)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: log-pose-review-facts
  cancel-in-progress: false

jobs:
  review-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      META_API_URL: ${{ vars.META_API_URL || vars.ANALYST_API_URL || secrets.ANALYST_API_URL }}
      # For --post: the same URL and secret the main Log Pose eval and the bot self-play job use.
      ANALYST_API_URL: ${{ vars.ANALYST_API_URL || secrets.ANALYST_API_URL }}
      ANALYST_SERVICE_SECRET: ${{ secrets.ANALYST_SERVICE_SECRET }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Add the ANTHROPIC_API_KEY repository secret to run the review fact-check." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ inputs.post }}" = "true" ] && { [ -z "$ANALYST_API_URL" ] || [ -z "$ANALYST_SERVICE_SECRET" ]; }; then
            echo "post=true needs ANALYST_API_URL and ANALYST_SERVICE_SECRET." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fetch the current meta decks
        if: ${{ env.META_API_URL != '' }}
        run: npm run meta-decks -w @optcg/analyst -- --api "$META_API_URL" --out "$PWD/meta-decks.json" --leaders 16 --days 30
      - name: Run the fact-check
        env:
          VARIANT: ${{ inputs.variant }}
          N: ${{ inputs.n }}
          SEED: ${{ inputs.seed }}
          LEVELS: ${{ inputs.levels }}
          MAX_USD: ${{ inputs.max_usd }}
          POST: ${{ inputs.post }}
        run: |
          ARGS=(--variant "$VARIANT" --n "$N" --seed "$SEED" --levels "$LEVELS" --max-usd "$MAX_USD")
          if [ "$POST" = "true" ]; then ARGS+=(--post); fi
          if [ -f "$PWD/meta-decks.json" ]; then ARGS+=(--decks "$PWD/meta-decks.json"); fi
          npm run eval:review-facts -w @optcg/analyst -- "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          f="analyst/evals/out/review-facts/${{ inputs.variant }}/report.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log-pose-review-facts-${{ inputs.variant }}
          path: analyst/evals/out/review-facts/${{ inputs.variant }}
          if-no-files-found: ignore
