name: Log Pose eval

# Manual only: the paid Log Pose eval (analyst/evals, ~$6-7 for the full run). Never scheduled.
#
# Needs the ANTHROPIC_API_KEY secret. With planner "live" it also needs ANALYST_API_URL and ANALYST_SERVICE_SECRET
# (the same ones the bot self-play job uses), so stats, tournament and bot-game reads come from the real backend.
# With "post" on, the score is saved to the admin page (POST /admin/evals, #667).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Output folder / run label"
        default: "live"
      planner:
        description: "fake (fixture stats) or live (real backend, includes bot games)"
        default: "live"
      reps:
        description: "Repetitions per case"
        default: "2"
      only:
        description: "Case ids regex (empty = all of groups A-D)"
        default: ""
      max_usd:
        description: "Stop dispatching past this spend"
        default: "15"
      post:
        description: "Save the score to the admin page"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: log-pose-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANALYST_API_URL: ${{ vars.ANALYST_API_URL || secrets.ANALYST_API_URL }}
      PLANNER_API_URL: ${{ vars.ANALYST_API_URL || secrets.ANALYST_API_URL }}
      ANALYST_SERVICE_SECRET: ${{ secrets.ANALYST_SERVICE_SECRET }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Add the ANTHROPIC_API_KEY repository secret to run the eval." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ inputs.planner }}" = "live" ] && { [ -z "$PLANNER_API_URL" ] || [ -z "$ANALYST_SERVICE_SECRET" ]; }; then
            echo "planner=live needs ANALYST_API_URL and ANALYST_SERVICE_SECRET." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run the eval
        env:
          VARIANT: ${{ inputs.variant }}
          PLANNER: ${{ inputs.planner }}
          REPS: ${{ inputs.reps }}
          ONLY: ${{ inputs.only }}
          MAX_USD: ${{ inputs.max_usd }}
          POST: ${{ inputs.post }}
        run: |
          ARGS=(--variant "$VARIANT" --planner "$PLANNER" --reps "$REPS" --max-usd "$MAX_USD")
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$POST" = "true" ]; then ARGS+=(--post); fi
          npm run eval -w @optcg/analyst -- "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          f="analyst/evals/out/${{ inputs.variant }}/report.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log-pose-eval-${{ inputs.variant }}
          path: analyst/evals/out/${{ inputs.variant }}
          if-no-files-found: ignore
