name: CI

# Runs every test suite on pull requests and on main, so a PR shows red before
# merge instead of after a deploy. Each app has its own lockfile, so each gets
# its own job and runs in parallel.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules-and-game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @optcg/rules
      - run: npm run typecheck -w @optcg/game-server
      - run: npm test

  duel-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: duel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: duel-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  duel-web-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: duel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: duel-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Layout check
        run: node scripts/layout-check.mjs http://localhost:4173 layout-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-web-layout-shots
          path: duel-web/layout-shots
          if-no-files-found: ignore

  duel-web-e2e:
    # Click-through tests: duel-web in Chromium against a real local game
    # server (the FastAPI backend is faked in the browser). See duel-web/e2e/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            duel-web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: duel-web
      - run: npx playwright install --with-deps chromium
        working-directory: duel-web
      - run: npx playwright test
        working-directory: duel-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-web-e2e-report
          path: |
            duel-web/playwright-report
            duel-web/test-results
          if-no-files-found: ignore

  frontend-e2e:
    # Click-through and layout-audit tests: the planner SPA in Chromium at 1200px
    # and 375px (the FastAPI backend is faked in the browser). Retries are
    # reported as "flaky" in the log, not hidden. See frontend/playwright.config.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -p e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  frontend-visual:
    # Pixel snapshots (@visual) of the planner at 1200px and 375px. Baselines are
    # per platform; on a mismatch the report and test-results hold the
    # expected/actual/diff PNGs. To re-bless, run "Update planner snapshots".
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-visual-diffs
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Script tests (importer, cosmetics)
        working-directory: scripts
        run: python -m unittest test_bandai_metadata test_cosmetics_product_ids
