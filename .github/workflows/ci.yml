name: CI

# Runs every test suite on pull requests and on main, so a PR shows red before
# merge instead of after a deploy. Each app has its own lockfile, so each gets
# its own job and runs in parallel.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules-and-game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis for the game-server pool tests (two processes sharing rooms).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @optcg/rules
      - run: npm run typecheck -w @optcg/game-server
      - run: npm run typecheck -w @optcg/analyst
      - run: npm test
      - run: npm run eval:validate -w @optcg/analyst
      # Fixed-seed fuzz games; a failure prints the seed and intent index to replay.
      - run: npm run fuzz:smoke -w @optcg/rules
      # Views (getPlayerView per seat after every move) must stay well ahead of the uncached path, timed in one process.
      - run: npm run bench:views -w @optcg/rules -- --gate
      # Every mutation anchor must still match exactly once (no tests run).
      - run: node tools/mutation-check/run.cjs --check-anchors

  duel-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: duel-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: duel-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  duel-web-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: duel-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: duel-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Layout check
        run: node scripts/layout-check.mjs http://localhost:4173 layout-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: duel-web-layout-shots
          path: duel-web/layout-shots
          if-no-files-found: ignore

  duel-web-e2e-shard:
    # Click-through tests: duel-web in Chromium against a real local game
    # server (the FastAPI backend is faked in the browser). See duel-web/e2e/README.md.
    # Split four ways so the suite's wall time is a fraction of a single job's (#485);
    # each shard is its own runner, so the fixed ports never collide. Specs are
    # assigned by recorded duration (duel-web/e2e/timings.json, #737), not by
    # count, so the shards finish together. The `duel-web-e2e` job below is the
    # one PRs require.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            duel-web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: duel-web
      - run: npx playwright install --with-deps chromium
        working-directory: duel-web
      - name: Run this shard's specs
        working-directory: duel-web
        run: |
          FILES="$(node scripts/e2e-shards.mjs ${{ matrix.shard }} 4)"
          if [ -z "$FILES" ]; then
            echo "No specs in shard ${{ matrix.shard }}; skipping."
            exit 0
          fi
          # Unquoted on purpose: one argument per spec file.
          npx playwright test $FILES
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: duel-web-e2e-report-${{ matrix.shard }}
          path: |
            duel-web/playwright-report
            duel-web/playwright-report-json
            duel-web/test-results
          if-no-files-found: ignore

  duel-web-e2e:
    # Aggregates the shards under the original check name, so branch protection
    # and the PR checks list keep one `duel-web-e2e`. `!cancelled()` makes it
    # run (and fail) when a shard fails or times out instead of being skipped,
    # but not when a newer push cancels the whole run (always() would post a
    # red check on the superseded commit).
    needs: duel-web-e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.duel-web-e2e-shard.result }}
        run: |
          echo "duel-web-e2e shards: ${SHARDS_RESULT}"
          test "${SHARDS_RESULT}" = "success"

  frontend-e2e:
    # Click-through and layout-audit tests: the planner SPA in Chromium at 1200px
    # and 375px (the FastAPI backend is faked in the browser). Retries are
    # reported as "flaky" in the log, not hidden. See frontend/playwright.config.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -p e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  frontend-visual:
    # Pixel snapshots (@visual) of the planner at 1200px and 375px. Baselines are
    # per platform; on a mismatch the report and test-results hold the
    # expected/actual/diff PNGs. To re-bless, run "Update planner snapshots".
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-visual-diffs
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Script tests (importer, cosmetics, preview art, alt arts)
        working-directory: scripts
        run: python -m unittest test_bandai_metadata test_cosmetics_product_ids test_sync_preview_art test_sync_alt_arts

  backend-postgres:
    # Same pytest suite against a real Postgres (prod is Neon): catches dialect
    # differences SQLite hides, like boolean ALTER defaults in the startup migrations.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The official image through Google's Docker Hub mirror: anonymous Docker Hub pulls
        # from shared runners hit its rate limit and fail the job before any test runs (#477).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optcg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Backend tests (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optcg_test
        run: python -m pytest -q

  mutation-plan:
    # Pull requests only. Finds the mutation entries this PR adds or changes
    # (tools/mutation-check/changed.cjs) and splits them into parts, one per
    # parallel runner, so a big PR does not run every mutation serially on one
    # machine (#632 took 41 minutes that way). Needs no installs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the base the PR merges into
        # The checkout is the PR's test merge commit, whose first parent is the
        # base branch as GitHub merged it. pull_request.base.sha can be older
        # than that (it isn't updated when the base moves), and diffing against
        # it re-runs every mutation main gained since.
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Plan mutation parts
        id: plan
        run: |
          set -o pipefail
          node tools/mutation-check/changed.cjs "$BASE_SHA" --matrix > "$RUNNER_TEMP/matrix.json"
          cat "$RUNNER_TEMP/matrix.json"
          {
            echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")"
            echo "any=$(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(m.length>0)' "$RUNNER_TEMP/matrix.json")"
          } >> "$GITHUB_OUTPUT"

  mutation-proofs-part:
    # One runner per part of the plan. Installs only what its suite needs.
    # Playwright suites (duel-e2e, frontend-e2e) are never planned; run those
    # locally. Matrix values come from PR content, so they reach the shell only
    # through env, never interpolated into the script.
    needs: mutation-plan
    if: github.event_name == 'pull_request' && needs.mutation-plan.outputs.any == 'true'
    name: mutation-proofs (${{ matrix.suite }} ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    # Redis for the game-server pool tests, so their mutations can be killed here too.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install root workspace deps
        if: contains(fromJSON('["rules","deck-analytics","patch-notes","ui","site-legal","analyst-client","analyst","game-server"]'), matrix.suite)
        run: npm ci
      - name: Install duel-web deps
        if: matrix.suite == 'duel-web'
        run: npm ci
        working-directory: duel-web
      - name: Install frontend deps
        if: matrix.suite == 'frontend'
        run: npm ci
        working-directory: frontend
      - name: Install mobile deps
        if: matrix.suite == 'mobile'
        run: npm ci
        working-directory: mobile
      - uses: actions/setup-python@v7
        if: matrix.suite == 'backend'
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        if: matrix.suite == 'backend'
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
          # run.cjs's pytest runner reads this; the importer and cosmetics
          # suites use plain python3 (standard library only).
          echo "BACKEND_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - name: Run mutation proofs
        env:
          SUITE: ${{ matrix.suite }}
          ONLY: ${{ matrix.only }}
        run: node tools/mutation-check/run.cjs "$SUITE" --only "$ONLY"

  mutation-proofs:
    # Aggregates the plan and the parts under the original check name, so branch
    # protection and the PR checks list keep one `mutation-proofs`. The parts job
    # is skipped when no mutation entry changed, which counts as a pass.
    needs: [mutation-plan, mutation-proofs-part]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          PARTS_RESULT: ${{ needs.mutation-proofs-part.result }}
        run: |
          echo "mutation-plan: ${PLAN_RESULT}"
          echo "mutation-proofs parts: ${PARTS_RESULT}"
          test "${PLAN_RESULT}" = "success"
          test "${PARTS_RESULT}" = "success" || test "${PARTS_RESULT}" = "skipped"
