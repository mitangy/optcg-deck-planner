name: Catalog sync
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger and wait for catalog sync
        env:
          # Public Render host is the default; optional secret override for staging.
          API_URL: ${{ secrets.API_URL }}
          CATALOG_SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          API_URL="${API_URL:-https://optcg-api-nutb.onrender.com}"
          API_URL="${API_URL%/}"

          if [ -z "${CATALOG_SYNC_TOKEN:-}" ]; then
            echo "::error::CATALOG_SYNC_TOKEN GitHub Actions secret is empty."
            echo "Copy CATALOG_SYNC_TOKEN from Render (optcg-api → Environment) into"
            echo "GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Writes response body to the path in $1; prints nothing on success.
          # Free Render instances cold-start slowly; retry transient failures.
          curl_auth() {
            local out_file="$1"
            local method="$2"
            local path="$3"
            local attempt=1
            local max_attempts=8
            local delay=15
            local body_file
            body_file="$(mktemp)"
            while true; do
              local http_code
              http_code="$(
                curl -sS -o "$body_file" -w "%{http_code}" \
                  -X "$method" "${API_URL}${path}" \
                  -H "X-Catalog-Token: ${CATALOG_SYNC_TOKEN}" \
                  -H "Accept: application/json" \
                  --connect-timeout 30 \
                  --max-time 120 \
                  || true
              )"
              if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
                mv "$body_file" "$out_file"
                return 0
              fi
              echo "Attempt ${attempt}/${max_attempts}: HTTP ${http_code:-000} for ${method} ${path}" >&2
              if [ -s "$body_file" ]; then
                head -c 400 "$body_file" >&2 || true
                echo >&2
              fi
              if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
                rm -f "$body_file"
                echo "::error::Catalog sync auth failed (HTTP ${http_code}). Check CATALOG_SYNC_TOKEN matches Render." >&2
                return 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                rm -f "$body_file"
                echo "::error::Gave up calling ${method} ${path} after ${max_attempts} attempts." >&2
                return 1
              fi
              attempt=$((attempt + 1))
              sleep "$delay"
              if [ "$delay" -lt 60 ]; then
                delay=$((delay + 15))
              fi
            done
          }

          echo "Enqueueing catalog sync at ${API_URL}/admin/sync-catalog"
          start_file="$(mktemp)"
          curl_auth "$start_file" POST /admin/sync-catalog
          echo
          cat "$start_file"
          echo
          start_status="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <"$start_file")"
          rm -f "$start_file"
          if [ "$start_status" != "started" ] && [ "$start_status" != "already_running" ]; then
            echo "::error::Unexpected enqueue response status: ${start_status}"
            exit 1
          fi

          echo "Polling /admin/sync-catalog/status until the background job finishes"
          # Full TCGCSV pull walks every set; allow a long window on free Render.
          # Interpret status in Python — bash IFS collapses empty tab fields, which
          # previously treated a successful last_result JSON as last_error.
          deadline=$((SECONDS + 2400))
          status_file="$(mktemp)"
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl_auth "$status_file" GET /admin/sync-catalog/status
            set +e
            parse_out="$(
              python3 - "$status_file" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          running = bool(data.get("running"))
          finished = data.get("finished_at") or ""
          err = data.get("last_error") or ""
          result = data.get("last_result")
          print(f"running={int(running)} finished_at={finished or 'none'}", flush=True)
          if running:
              sys.exit(10)
          if not finished:
              sys.exit(12)
          if err:
              print(err)
              sys.exit(11)
          print(json.dumps(result) if result is not None else "ok")
          sys.exit(0)
          PY
            )"
            rc=$?
            set -e
            echo "$parse_out"
            case "$rc" in
              0)
                rm -f "$status_file"
                echo "Catalog sync completed."
                exit 0
                ;;
              10|12)
                sleep 20
                continue
                ;;
              11)
                # parse_out is: status line + error message on the next line(s)
                err="$(printf '%s\n' "$parse_out" | tail -n +2)"
                rm -f "$status_file"
                echo "::error::Catalog sync failed: ${err:-unknown}"
                exit 1
                ;;
              *)
                rm -f "$status_file"
                echo "::error::Unexpected status parser exit code: ${rc}"
                exit 1
                ;;
            esac
          done

          rm -f "$status_file"
          echo "::error::Timed out waiting for catalog sync to finish."
          exit 1
