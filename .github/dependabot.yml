# mobile/ and trailer/ are outside the workspace and are not watched.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to 1.56.1: the CI image (ubuntu-24.04) and the planner's pixel
      # baselines are tied to that Chromium build. Bump by hand.
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
