# Keeps the pinned GitHub Actions current (the Node 20 runtime deprecation, #485),
# the root npm workspace (packages, game-server, analyst, frontend, duel-web: one
# lockfile) and the backend's Python requirements. One weekly PR per ecosystem.
# mobile/ and trailer/ are outside the workspace and are not watched.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to 1.56.1: the CI image (ubuntu-24.04) and the planner's pixel
      # baselines are tied to that Chromium build. Bump by hand.
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # backend/requirements.in is the hand-edited list; requirements.txt is the compiled pin file.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
