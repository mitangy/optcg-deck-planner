# Keeps the pinned GitHub Actions current (the Node 20 runtime deprecation, #485).
# One weekly PR for all action bumps; app dependencies are managed separately.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
