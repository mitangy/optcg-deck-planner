# mutmut (nightly breadth mutation testing; see tools/mutation-check/README.md).
# Targets pricing/aggregation logic, not FastAPI routers or ORM glue.
[mutmut]
source_paths = app/
only_mutate =
    app/domain.py
    app/services.py
    app/catalog_sync.py
    app/recent_sales.py
    app/tcgplayer_receipt.py
    app/group_buy_merge.py
    app/group_buy_settlement.py
also_copy =
    pytest.ini
pytest_add_cli_args_test_selection =
    tests/
